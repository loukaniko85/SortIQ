# Build AppImage and Docker image on push/release
name: Build

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ── AppImage ───────────────────────────────────────────────────────────────
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget rsync libfuse2 fuse file

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Verify AppImage
        run: |
          ls -lh SortIQ-*-x86_64.AppImage
          file SortIQ-*-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SortIQ-AppImage-x86_64
          path: SortIQ-*-x86_64.AppImage
          retention-days: 30

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: SortIQ-*-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -r requirements.txt

      - name: Build Windows exe
        shell: bash
        run: |
          chmod +x build_windows.sh
          ./build_windows.sh

      - name: Verify output
        shell: bash
        run: ls -lh SortIQ-*-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SortIQ-Windows
          path: SortIQ-*-Windows.zip
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: SortIQ-*-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ───────────────────────────────────────────────────────────────────
  macos:
    name: Build macOS Universal DMG
    # macos-13 is an Intel runner with Rosetta installed, which is required for
    # universal2 (arm64 + x86_64) cross-compilation. macos-14 is arm64-only.
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pyinstaller>=6.0" pillow
          pip install -r requirements.txt
          brew install create-dmg || true

      - name: Build macOS Universal app + dmg
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Verify output
        run: |
          ls -lh SortIQ-*-macOS-universal.dmg
          # Verify the app binary is a fat universal binary
          APP=$(find dist -name "SortIQ" -type f 2>/dev/null | head -1)
          [ -n "$APP" ] && lipo -archs "$APP" || echo "Binary not found for lipo check"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SortIQ-macOS-universal
          path: SortIQ-*-macOS-universal.dmg
          retention-days: 30

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: SortIQ-*-macOS-universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker ─────────────────────────────────────────────────────────────────
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Build locally first so we can smoke-test before pushing
      - name: Build Docker image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: sortiq:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify PyQt6 and all core modules import without errors.
      # Uses QT_QPA_PLATFORM=offscreen so no display is needed in CI.
      - name: Smoke test — PyQt6 + core modules
        run: |
          docker run --rm \
            -e QT_QPA_PLATFORM=offscreen \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e DBUS_SESSION_BUS_ADDRESS="unix:path=/dev/null/nosuchsocket" \
            -e NO_AT_BRIDGE=1 \
            --timeout 60 \
            sortiq:ci-test \
            python3 -c "
          import sys
          # Test PyQt6 imports without instantiating QApplication —
          # QApplication() can hang in CI when DBus portal registration blocks.
          import PyQt6.sip
          import PyQt6.QtCore
          import PyQt6.QtGui
          import PyQt6.QtWidgets
          print('PyQt6 OK')
          from core.matcher import MediaMatcher
          from core.renamer import FileRenamer
          from core.history import RenameHistory
          from core.presets import PresetManager
          from core.artwork import ArtworkDownloader
          from core.media_info import MediaInfoExtractor
          print('All core modules OK')
          "

      # Push the final image (only on non-PR events)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
